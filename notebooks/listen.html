<div id="lc" dir="rtl">
<style>
  #lc { --bg: #fafaf7; --fg: #1a1a1a; --muted: #6b6b6b; --line: #d8d8d0; --accent: #1f7a4d; --soft: #e6f2ec; --bad: #b3261e;
        background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif;
        max-width: 640px; padding: 20px; border-radius: 12px; border: 1px solid var(--line); }
  #lc .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  #lc button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
               background: #fff; color: var(--fg); cursor: pointer; min-width: 96px; }
  #lc button:hover:not(:disabled) { border-color: var(--accent); }
  #lc button:disabled { opacity: .45; cursor: default; }
  #lc button.playing { background: var(--accent); border-color: var(--accent); color: #fff; }
  #lc button.pick.on { background: var(--soft); border-color: var(--accent); font-weight: 600; }
  #lc button.next { background: var(--accent); border-color: var(--accent); color: #fff; }
  #lc .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  #lc .title { font-size: 20px; font-weight: 600; }
  #lc .muted { color: var(--muted); font-size: 14px; }
  #lc .reveal { border-top: 1px solid var(--line); padding-top: 10px; min-height: 84px; }
  #lc .reveal div { padding: 2px 6px; border-radius: 6px; }
  #lc .reveal .chosen { background: var(--soft); font-weight: 600; }
  #lc .error { color: var(--bad); }
  #lc .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  #lc .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 10px 0; background: #fff; }
  #lc .card .row { margin: 8px 0 0; gap: 6px; }
  #lc button.tag { min-width: 0; padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  #lc button.tag.on { background: var(--soft); border-color: var(--accent); }
  #lc input.note { font: inherit; font-size: 14px; width: 100%; box-sizing: border-box; margin-top: 8px;
                   padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--fg); }
</style>
<div class="head">
  <div class="title" id="lc-title"></div>
  <div class="muted num" id="lc-count"></div>
</div>
<div class="muted" id="lc-help"></div>
<div class="row" id="lc-play"></div>
<div class="row" id="lc-votes"></div>
<div class="reveal" id="lc-reveal"></div>
<div class="muted" id="lc-status"></div>
<audio id="lc-audio" preload="none"></audio>
<script>
(() => {
  const items = __ITEMS__;
  const TAGS = __TAGS__;
  const REVIEW = __MODE__ === "review";
  const LETTERS = ["أ", "ب", "ج"];
  const NAMES = {"othman-engine": "محرك عثمان", "munajjam-whisperx": "منجّم (whisperx)", "mp3quran": "mp3quran"};
  const REVEAL_MS = REVIEW ? 600 : 2000;
  const HELP = REVIEW
    ? "آيات خسرها محركنا. اسمع قصّنا وقصّ الفائز، وحدد وش المشكلة في قصّنا (والفائز إذا تبي)."
    : "اسمعها كلها، واختر أفضل قصّ: يبدأ مع أول الآية ويوقف مع آخرها بدون ما يقص منها أو يدخل من الآية اللي قبلها أو بعدها. "
      + "إذا تساوى أكثر من واحد في الأفضلية اخترهم كلهم. الملاحظات تحت كل قصّة اختيارية.";
  const $ = (id) => document.getElementById(id);
  const audio = $("lc-audio");
  let index = 0, order = [], picked = new Set(), notes = {}, playToken = 0, busy = false;

  const fmt = (s) => s.toFixed(2);
  const shuffle = (list) => {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };

  function button(label, className, onClick) {
    const el = document.createElement("button");
    el.textContent = label;
    el.className = className;
    el.addEventListener("click", onClick);
    return el;
  }

  function stop() {
    playToken++;
    audio.pause();
    document.querySelectorAll("#lc-play button").forEach((b) => b.classList.remove("playing"));
  }

  function waitFor(event) {
    return new Promise((resolve, reject) => {
      const done = () => { cleanup(); resolve(); };
      const fail = () => { cleanup(); reject(audio.error); };
      const cleanup = () => { audio.removeEventListener(event, done); audio.removeEventListener("error", fail); };
      audio.addEventListener(event, done);
      audio.addEventListener("error", fail);
    });
  }

  async function play(slot, el) {
    const item = items[index];
    const [start, end] = item.times[order[slot]];
    stop();
    const token = playToken;
    el.classList.add("playing");
    $("lc-status").textContent = "";
    try {
      if (audio.src !== item.audio_url) {
        audio.src = item.audio_url;
        audio.load();
        await waitFor("loadedmetadata");
      }
      audio.currentTime = start;
      await waitFor("seeked");
      if (token !== playToken) return;
      await audio.play();
    } catch (error) {
      if (token === playToken) {
        el.classList.remove("playing");
        $("lc-status").innerHTML = '<span class="error">ما اشتغل الصوت. تأكد من الإنترنت وجرّب مرة ثانية.</span>';
      }
      return;
    }
    // timeupdate يتأخر حتى ربع ثانية، فنراقب الوقت مع كل إطار لنوقف عند النهاية بالضبط
    const watch = () => {
      if (token !== playToken) return;
      if (audio.currentTime >= end || audio.ended) { stop(); return; }
      requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
  }

  function show() {
    stop();
    busy = false;
    $("lc-reveal").innerHTML = "";
    $("lc-status").textContent = "";
    $("lc-play").innerHTML = "";
    $("lc-votes").innerHTML = "";
    if (index >= items.length) {
      $("lc-title").textContent = "خلصت الآيات 🎉";
      $("lc-count").textContent = "";
      $("lc-reveal").textContent = REVIEW ? "شغّل خلية التحليل تحت." : "شغّل خلية النتيجة تحت عشان تشوف نسبة فوز كل مصدر.";
      return;
    }
    const item = items[index];
    // في المراجعة: محركنا أولاً ثم الفائزون، بأسمائهم
    order = REVIEW ? Object.keys(item.times) : shuffle(Object.keys(item.times));
    picked = new Set();
    notes = {};
    const label = (slot) => REVIEW ? NAMES[order[slot]] : LETTERS[slot];
    const round = REVIEW ? ` · هامش ${item.pad}` : "";
    $("lc-title").textContent = `${item.reciter} · سورة ${item.surah} · آية ${item.ayah}${round}`;
    $("lc-count").textContent = `${index + 1} / ${items.length}`;
    order.forEach((source, slot) => {
      const el = button(`▶ ${label(slot)}`, "", () => play(slot, el));
      $("lc-play").append(el);
    });
    $("lc-play").append(button("■ إيقاف", "", stop));
    const next = button(REVIEW ? "حفظ والتالي ←" : "التالي ←", "next", REVIEW ? saveReview : vote);
    next.disabled = !REVIEW;
    order.forEach((source, slot) => {
      const card = document.createElement("div");
      card.className = "card";
      if (REVIEW) {
        const [start, end] = item.times[source];
        const won = item.winners.includes(source) ? " ★ فاز" : "";
        card.innerHTML = `<b></b> <span class="muted num">${fmt(start)} → ${fmt(end)}</span>`;
        card.querySelector("b").textContent = NAMES[source] + won;
      } else {
        const el = button(`${LETTERS[slot]} الأفضل`, "pick", () => {
          picked.has(source) ? picked.delete(source) : picked.add(source);
          el.classList.toggle("on", picked.has(source));
          next.disabled = picked.size === 0;
        });
        card.append(el);
      }
      card.append(noteBox(source, REVIEW ? (item.notes || {})[source] : null));
      $("lc-votes").append(card);
    });
    $("lc-votes").append(next);
  }

  function noteBox(source, previous) {
    const note = notes[source] = {tags: new Set(previous ? previous.tags : []), text: previous ? previous.text : ""};
    const box = document.createElement("div");
    const tags = document.createElement("div");
    tags.className = "row";
    Object.entries(TAGS).forEach(([tag, text]) => {
      const el = button(text, "tag", () => {
        note.tags.has(tag) ? note.tags.delete(tag) : note.tags.add(tag);
        el.classList.toggle("on", note.tags.has(tag));
      });
      el.classList.toggle("on", note.tags.has(tag));
      tags.append(el);
    });
    const input = document.createElement("input");
    input.className = "note";
    input.placeholder = "ملاحظة (اختياري)";
    input.maxLength = 500;
    input.value = note.text;
    input.addEventListener("input", () => (note.text = input.value));
    box.append(tags, input);
    return box;
  }

  function notesPayload() {
    const payload = {};
    for (const [source, note] of Object.entries(notes)) {
      if (note.tags.size || note.text.trim()) payload[source] = {tags: [...note.tags], text: note.text.trim()};
    }
    return payload;
  }

  async function send(name, args) {
    if (busy) return false;
    busy = true;
    stop();
    document.querySelectorAll("#lc button, #lc input").forEach((b) => (b.disabled = true));
    $("lc-status").textContent = "يحفظ…";
    try {
      await google.colab.kernel.invokeFunction(name, args, {});
    } catch (error) {
      $("lc-status").innerHTML = '<span class="error">ما انحفظ. تأكد إن الجلسة شغالة (وإن خلية الصفحة مشغّلة في نفس الجلسة) وجرّب مرة ثانية.</span>';
      // نص الخطأ من بايثون يبيّن السبب (مثل دفتر قديم لا يستقبل الملاحظات)
      $("lc-status").append(" ", Object.assign(document.createElement("div"), {className: "muted num", textContent: String(error && error.message || error)}));
      document.querySelectorAll("#lc button, #lc input").forEach((b) => (b.disabled = false));
      busy = false;
      return false;
    }
    $("lc-status").textContent = "انحفظ ✓";
    return true;
  }

  async function saveReview() {
    if (!(await send("othman.review", [items[index].id, notesPayload()]))) return;
    setTimeout(() => { index++; show(); }, REVEAL_MS);
  }

  function reveal(item, winners) {
    $("lc-reveal").innerHTML = "";
    order.forEach((source, slot) => {
      const [start, end] = item.times[source];
      const line = document.createElement("div");
      line.className = winners.includes(source) ? "chosen" : "";
      line.innerHTML = `${LETTERS[slot]} = ${NAMES[source]} <span class="muted num">${fmt(start)} → ${fmt(end)}</span>`;
      $("lc-reveal").append(line);
    });
  }

  async function vote() {
    const item = items[index], winners = [...picked];
    if (!(await send("othman.vote", [item.id, winners, order, notesPayload()]))) return;
    reveal(item, winners);
    setTimeout(() => { index++; show(); }, REVEAL_MS);
  }

  $("lc-help").textContent = HELP;
  show();
})();
</script>
</div>
